[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-1c77-explorer"
version = "0.3.0"
description = "MCP server for 1C:Enterprise 7.7 configuration metadata with Explorer UI"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.7",
    "olefile>=0.47",
    "pydantic>=2.0",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "starlette>=0.37",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
mcp-1c77-cli = "mcp_1c77.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_1c77 = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
